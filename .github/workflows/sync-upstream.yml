name: Sync Upstream

# Keeps this mirror's `main` in step with the canonical repository,
# https://github.com/sickn33/agentic-awesome-skills. Runs daily and can
# also be triggered manually from the Actions tab.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-upstream:
    if: github.repository == 'ntxnasty-spec/agentic-awesome-skills'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch canonical upstream
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/sickn33/agentic-awesome-skills.git
          git fetch upstream main

      - name: Compare against upstream
        id: diff
        run: |
          set -euo pipefail

          upstream_head="$(git rev-parse upstream/main)"
          local_head="$(git rev-parse HEAD)"

          if [ "$upstream_head" = "$local_head" ]; then
            status=up-to-date
          elif git merge-base --is-ancestor HEAD upstream/main; then
            status=fast-forward
          else
            status=diverged
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$upstream_head" >> "$GITHUB_OUTPUT"
          echo "Sync status: $status ($local_head -> $upstream_head)"

      - name: Fast-forward main to upstream
        id: push
        if: steps.diff.outputs.status == 'fast-forward'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git merge --ff-only upstream/main

          if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Direct push to main was rejected (likely a protected branch); falling back to a pull request."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does not start a new workflow run, so the
      # push-triggered `main-validation-and-sync` job in ci.yml would never see
      # this commit. Dispatch it explicitly instead.
      - name: Run main validation on the synced commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh workflow run ci.yml --ref main \
            || echo "::warning::Could not dispatch ci.yml; run it manually against main."

      - name: Open a PR when a direct push isn't possible
        if: steps.diff.outputs.status == 'diverged' || (steps.diff.outputs.status == 'fast-forward' && steps.push.outputs.pushed == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_HEAD: ${{ steps.diff.outputs.upstream_head }}
        run: |
          set -euo pipefail

          branch="automation/sync-upstream"

          # Check before touching the branch: if a sync PR is already open, a
          # maintainer may have resolved conflicts on it, and a force-push here
          # would throw that work away.
          state="$(gh pr view "$branch" --json state -q .state 2>/dev/null || true)"
          if [ "$state" = "OPEN" ]; then
            echo "PR for $branch is already open; leaving the branch untouched."
            exit 0
          fi

          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            upstream/main:"refs/heads/$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --draft \
            --title "chore: sync with sickn33/agentic-awesome-skills" \
            --body "Brings \`main\` up to date with the canonical upstream repository, [sickn33/agentic-awesome-skills](https://github.com/sickn33/agentic-awesome-skills) (\`${UPSTREAM_HEAD}\`).

          Opened automatically by the Sync Upstream workflow because \`main\` could not be fast-forwarded directly (branch protection or local history that diverged from upstream). Review the diff before merging."
